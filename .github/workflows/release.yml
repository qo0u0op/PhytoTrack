name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            type: app-image
            artifact: phytotrack-win-portable
          - os: ubuntu-latest
            type: app-image
            artifact: phytotrack-appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/src/main/resources/static
          cp -r dist ../backend/src/main/resources/static

      - name: Build backend
        shell: bash
        run: cd backend && mvn --batch-mode package -DskipTests

      - name: Run jpackage (portable app-image, not installer)
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION//-/.}
          VERSION=$(echo "$VERSION" | cut -d. -f1-3)
          ICON_ARG=""
          if [ "$RUNNER_OS" = "Windows" ] && [ -f docs/img/icon.ico ]; then
            ICON_ARG="--icon docs/img/icon.ico"
          elif [ -f docs/img/icon.png ]; then
            ICON_ARG="--icon docs/img/icon.png"
          fi
          EXTRA_JAVA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_JAVA="--java-options -Dspring.profiles.active=prod"
          fi
          jpackage --type app-image \
            --name phytotrack \
            --input backend/target \
            --main-jar phytotrack-0.0.1-SNAPSHOT.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --dest dist \
            --app-version "$VERSION" \
            --java-options -Xmx512m \
            --java-options -Dfile.encoding=UTF-8 \
            $ICON_ARG $EXTRA_JAVA

      - name: Build AppImage (Linux only, not macOS)
        if: matrix.type == 'app-image' && runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -d dist/phytotrack ]; then
            echo "app-image not found in dist/, skip AppImage"
            exit 0
          fi
          # 下載 appimagetool（若無）
          if ! command -v appimagetool >/dev/null 2>&1; then
            mkdir -p /tmp/appimage
            curl -L -o /tmp/appimage/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimage/appimagetool
            APPIMAGETOOL=/tmp/appimage/appimagetool
          else
            APPIMAGETOOL=appimagetool
          fi
          # 組 AppDir（可攜，預設 prod）
          rm -rf dist/AppDir
          mkdir -p dist/AppDir/usr/bin
          cp -r dist/phytotrack/* dist/AppDir/usr/bin/
          cat > dist/AppDir/AppRun << 'APPRUN'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          # 直接進入系統托盤，不開啟終端
          if echo "$@" | grep -q "spring.profiles.active"; then
            exec "$HERE/usr/bin/bin/phytotrack" "$@"
          else
            exec "$HERE/usr/bin/bin/phytotrack" --spring.profiles.active=prod "$@"
          fi
          APPRUN
          chmod +x dist/AppDir/AppRun
          mkdir -p dist/AppDir
          cat > dist/AppDir/phytotrack.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=PhytoTrack
          Comment=農作物病蟲害診斷記錄系統
          Exec=phytotrack
          Icon=phytotrack
          Type=Application
          Categories=Office;
          Terminal=false
          DESKTOP
          # 使用專案 icon.svg（Linux tray 優先 SVG，AppDir 用 PNG）
          if [ -f docs/img/icon.svg ]; then
            cp docs/img/icon.svg dist/AppDir/phytotrack.svg 2>/dev/null || true
          fi
          if [ -f docs/img/icon.png ]; then
            cp docs/img/icon.png dist/AppDir/phytotrack.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > dist/AppDir/phytotrack.png
          fi
          cp dist/AppDir/phytotrack.png dist/AppDir/.DirIcon 2>/dev/null || true
          mkdir -p dist/AppDir/usr/bin/config
          cp backend/phytotrack.toml.example dist/AppDir/usr/bin/config/ 2>/dev/null || true
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION//-/.}
          VERSION=$(echo "$VERSION" | cut -d. -f1-3)
          $APPIMAGETOOL dist/AppDir dist/PhytoTrack-"$VERSION"-x86_64.AppImage || $APPIMAGETOOL --appimage-extract-and-run dist/AppDir dist/PhytoTrack-"$VERSION"-x86_64.AppImage
          chmod +x dist/PhytoTrack-*.AppImage
          ls -lh dist/*.AppImage


      - name: Package Windows portable zip (prod only, no bat, direct exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -d dist/phytotrack ]; then echo "app-image not found, skip"; exit 0; fi
          VERSION=${GITHUB_REF#refs/tags/v}; VERSION=${VERSION//-/.}; VERSION=$(echo "$VERSION" | cut -d. -f1-3)
          cp backend/phytotrack.toml.example dist/phytotrack/config/ 2>/dev/null || true
          # Windows portable directly uses phytotrack.exe (with embedded icon from --icon), no bat
          powershell -Command "Compress-Archive -Path dist/phytotrack -DestinationPath dist/PhytoTrack-$VERSION-win.zip -Force"
          ls -lh dist/*.zip
          rm -rf dist/phytotrack

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
