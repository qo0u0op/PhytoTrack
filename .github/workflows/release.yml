name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            artifact: phytotrack-deb
          - os: windows-latest
            type: exe
            artifact: phytotrack-win
          - os: ubuntu-latest
            type: app-image
            artifact: phytotrack-appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/src/main/resources/static
          cp -r dist ../backend/src/main/resources/static

      - name: Build backend
        shell: bash
        run: cd backend && mvn --batch-mode package -DskipTests

      - name: Run jpackage
        shell: bash
        run: |
          jpackage --type ${{ matrix.type }} \
            --name phytotrack \
            --input backend/target \
            --main-jar phytotrack-0.0.1-SNAPSHOT.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --dest dist \
            --app-version ${GITHUB_REF#refs/tags/v} \
            --java-options -Xmx512m \
            --java-options -Dfile.encoding=UTF-8 \
            --linux-package-name phytotrack \
            --linux-app-category Office \
            --linux-shortcut \
            --win-shortcut \
            --win-menu || jpackage --type app-image \
              --name phytotrack \
              --input backend/target \
              --main-jar phytotrack-0.0.1-SNAPSHOT.jar \
              --main-class org.springframework.boot.loader.launch.JarLauncher \
              --dest dist \
              --app-version ${GITHUB_REF#refs/tags/v} \
              --java-options -Xmx512m

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
