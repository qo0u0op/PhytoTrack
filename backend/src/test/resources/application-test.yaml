spring:
  datasource:
    # 測試專用：獨立 SQLite 檔案，避免污染開發資料庫 backend/diagnoses.db
    url: jdbc:sqlite:./target/phytotrack-test.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
      # 測試以 schema.sql 單一真相建庫（schema-baseline 已合併為代理，僅為相容保留）
      schema-locations: classpath:schema.sql

app:
  rate-limit:
    enabled: false
  cors:
    allowed-origins: ""
  security-headers:
    enabled: false
