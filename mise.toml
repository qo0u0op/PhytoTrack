[tools]
java = "openjdk-21.0.2"
maven = "3.9.16"
node = "lts"
"npm:@playwright/cli" = "0.1.18"
"npm:@playwright/test" = "1.62.1"

[tasks.d2]
description = "Compile D2 diagrams to docs/img"

run = '''
mkdir -p docs/img

find docs/d2 -type f -name '*.d2' | while IFS= read -r f; do
  rel="${f#docs/d2/}"
  out="docs/img/${rel%.d2}.svg"
  mkdir -p "$(dirname "$out")"
  d2 "$f" "$out"
done
'''

[tasks."dev:backend"]
description = "啟動後端 dev server（dev profile，Swagger UI 於 :8080）"
run = "cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=dev"

[tasks."dev:frontend"]
description = "啟動前端 dev server（:5173，/api 代理至 8080；--host 供 Tailscale／LAN 連線）"
run = "cd frontend && npm run dev -- --host 0.0.0.0"

[tasks.dev]
description = "並行啟動前後端 dev server，就緒後維持運行"
run = '''
mise run dev:backend &
mise run dev:frontend &
for u in http://localhost:8080/api/ai/health http://localhost:5173; do
  until curl -sf -o /dev/null "$u"; do sleep 1; done
done
wait
'''
