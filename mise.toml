[tools]
java = "openjdk-21.0.2"
maven = "3.9.15"

[tasks.d2]
description = "Compile D2 diagrams to docs/img"

run = '''
mkdir -p docs/img

find docs/d2 -type f -name '*.d2' | while IFS= read -r f; do
  rel="${f#docs/d2/}"
  out="docs/img/${rel%.d2}.svg"
  mkdir -p "$(dirname "$out")"
  d2 "$f" "$out"
done
'''

[tasks."dev:backend"]
description = "啟動後端 dev server（dev profile，Swagger UI 於 :8080）"
run = "cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev"

[tasks."dev:frontend"]
description = "啟動前端 dev server（:5173，/api 代理至 8080）"
run = "cd frontend && npm run dev"

[tasks.dev]
description = "並行啟動前後端 dev server，就緒後維持運行"
run = ["mise run dev:backend", "mise run dev:frontend"]
wait_for = ["http://localhost:8080/api/ai/health", "http://localhost:5173"]
