<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>會員註冊作業</title>
		<link rel="stylesheet" data-th-href="@{/css/user-hero.css}" href="/css/user-hero.css">
		<!-- SweetAlert2 離線安裝（all-in-one，含 CSS + JS） -->
		<script data-th-src="@{/js/sweetalert2.all.min.js}" src="/js/sweetalert2.all.min.js"></script>
	</head>
	<body class="auth-page">
		<main class="hero-layout">
			<section class="hero-copy" aria-label="註冊頁導覽">
				<p class="eyebrow">Diagnoses System</p>
				<h1>建立您的工作帳號</h1>
				<p class="lead">完成註冊後即可管理個人帳號與客戶資料，快速進入系統。</p>
				<div class="hero-actions">
					<a class="ghost-btn" data-th-href="@{/user/login}" href="/user/login">我已有帳號</a>
					<a class="text-link" data-th-href="@{/}" href="/">回到首頁</a>
				</div>
				<ul class="feature-list">
					<li>專屬帳號管理：統一維護登入資訊與基本資料。</li>
					<li>快速登入流程：註冊完成後即可立即切換至登入操作。</li>
					<li>一致化操作介面：會員頁面採用相同 Hero 版型，體驗更清晰。</li>
				</ul>
			</section>

			<section class="form-panel" aria-label="註冊表單">
				<div class="form-card">
					<h2>註冊</h2>
					<p class="form-subtitle">請填寫以下欄位完成註冊作業。</p>

					<form method="post" class="auth-form" data-th-action="@{/user/register}">
						<div>
							<label for="username">帳號</label>
							<input id="username" type="text" name="username" autocomplete="username" required data-th-value="${user.username}">
						</div>

						<div>
							<label for="displayName">真實姓名</label>
							<input id="displayName" type="text" name="displayName" autocomplete="name" placeholder="某某某" required data-th-value="${user.displayName}">
						</div>

						<div>
							<label for="password">密碼</label>
							<input id="password" type="password" name="password" autocomplete="new-password" required data-th-value="${user.password}">
						</div>

						<div class="action-row">
							<button type="submit" class="btn">完成註冊</button>
							<button type="reset" class="btn secondary">重填資料</button>
						</div>
					</form>

					<p class="switch-hint">已經有帳號？<a data-th-href="@{/user/login}" href="/user/login">前往登入</a></p>
				</div>
			</section>
		</main>
		<!-- SweetAlert2 對話盒：由 Thymeleaf inline JS 傳入 Server 訊息 -->
		<script data-th-inline="javascript">
			/*<![CDATA[*/
			const msg     = /*[[${msg}]]*/ null;       // Server 傳來的訊息文字
			const success = /*[[${success}]]*/ null;   // true=成功 / false=失敗 / null=首次載入
			const loginUrl = /*[[@{/user/login}]]*/ '/user/login';
			
			if (msg !== null) {
				if (success) {
					// 註冊成功：顯示成功對話盒，按確定後導向登入頁
					Swal.fire({
						icon : 'success',
						title: '註冊成功',
						text : msg,
						confirmButtonText: '前往登入'
						}).then(() => {
							window.location.href = loginUrl;
							});
							} else {
								// 商業規則違反（帳號 / Email 重複）：顯示錯誤對話盒
								Swal.fire({
									icon : 'error',
									title: '註冊失敗',
									text : msg,
									confirmButtonText: '重新填寫'
									});
								}
							}
							/*]]>*/
		</script>
	</body>
</html>
