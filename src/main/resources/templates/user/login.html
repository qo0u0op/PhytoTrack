<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>登入作業</title>
		<link rel="stylesheet" data-th-href="@{/css/user-hero.css}" href="/css/user-hero.css">
		<!-- SweetAlert2 離線安裝（all-in-one，含 CSS + JS） -->
		<script data-th-src="@{/js/sweetalert2.all.min.js}" src="/js/sweetalert2.all.min.js"></script>
	</head>
	<body class="auth-page">
		<main class="hero-layout">
			<!--導覽說明區段-->
			<section class="hero-copy" aria-label="登入頁導覽">
				<p class="eyebrow">Diagnoses System</p>
				<h1>歡迎使用客服管理系統</h1>
				<p class="lead">登入後，延續你的操作流程。保持資料一致，讓每次使用都更有效率。</p>
				<div class="hero-actions">
					<a class="ghost-btn" data-th-href="@{/user/register}" href="/user/register">建立新帳號</a>
					<a class="text-link" data-th-href="@{/}" href="/">回到首頁</a>
				</div>
				<ul class="feature-list">
					<li>快速登入：精簡欄位設計，重點資訊一目了然。</li>
					<li>一致操作：與註冊頁面共用版型與互動風格。</li>
					<li>行動友善：支援手機與桌機裝置瀏覽與輸入。</li>
				</ul>
			</section>

			<!--登入表單區段-->
			<section class="form-panel" aria-label="登入表單">
				<div class="form-card">
					<h2>登入</h2>
					<p class="form-subtitle">請輸入帳號密碼完成登入作業。</p>

					<form method="post"
					      class="auth-form"
					      data-th-action="@{/user/login}"
					      data-th-object="${user}"
					>
						<div>
							<label for="username">帳號</label>
							<input id="username" data-th-field="*{username}" type="text" autocomplete="username" required>
						</div>

						<div>
							<label for="password">密碼</label>
							<input id="password" data-th-field="*{password}" type="password" autocomplete="current-password" required>
						</div>

						<div class="action-row">
							<button type="submit" class="btn">登入</button>
							<button type="reset" class="btn secondary">清除</button>
						</div>
					</form>

					<p class="switch-hint">還沒有帳號？<a data-th-href="@{/user/register}" href="/user/register">立即註冊</a></p>
				</div>
			</section>
		</main>
		<!-- SweetAlert2 對話盒：由 Thymeleaf inline JS 傳入 Server 訊息 -->
		<script data-th-inline="javascript">
			/*<![CDATA[*/
			const msg     = /*[[${msg}]]*/ null;       // Server 傳來的訊息文字
			const success = /*[[${success}]]*/ null;   // true=成功 / false=失敗 / null=首次載入
			const homeUrl = /*[[@{/}]]*/ '/';
			
			if (msg !== null) {
				if (success) {
					// 登入成功：顯示成功對話盒，按確定後導向首頁
					Swal.fire({
						icon : 'success',
						title: '登入成功',
						text : msg,
						confirmButtonText: '進入系統'
						}).then(() => {
							window.location.href = homeUrl;
							});
							} else {
								// 帳號不存在或密碼錯誤：顯示錯誤對話盒
								Swal.fire({
									icon : 'error',
									title: '登入失敗',
									text : msg,
									confirmButtonText: '重新輸入'
									});
								}
							}
							/*]]>*/
		</script>
	</body>
</html>
