spring:
  application:
    # 應用程式名稱（顯示於 Spring 啟動資訊）
    name: PhytoTrack
  datasource:
    # SQLite DataSource
    url: jdbc:sqlite:./diagnoses.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # HikariCP - SQLite 相容設定
      # 檔案型別資料庫 無法支援連接池(Connection Pool)，
      # 因此設定最大連接數為 1，並使用簡單的測試查詢來確保連接有效。
      connection-test-query: SELECT 1
      maximum-pool-size: 1
  jpa:
    #Spring jpa 資料庫方言設定，使用 SQLite 的 Hibernate 方言
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    # Hibernate DDL 自動更新設定，根據實體類別自動更新資料庫結構（不會刪除現有資料）
    hibernate:
      ddl-auto: update
    show-sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: false
  sql:
    # 啟動時自動執行 schema.sql 建立資料表（IF NOT EXISTS 確保重複啟動不報錯）
    init:
      mode: always
